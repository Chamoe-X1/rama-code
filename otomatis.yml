name: Jalankan Python Otomatis

# Mengatur kapan skrip akan berjalan otomatis
on:
  schedule:
    # Menggunakan format CRON (Contoh di bawah: Berjalan otomatis setiap hari jam 00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Baris ini membuat Anda bisa menjalankan skrip secara manual kapan saja lewat web GitHub

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori Anda ke server GitHub Actions
      - name: Checkout repositori
        uses: actions/checkout@v4

      # 2. Menyiapkan lingkungan Python di server
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Sesuaikan dengan versi Python Anda

      # 3. Menginstall library pendukung jika ada file requirements.txt
      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Mengeksekusi file Python utama Anda
      - name: Jalankan Script Python
        run: python main.py
